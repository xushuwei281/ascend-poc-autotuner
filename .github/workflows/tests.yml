name: Python tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python scripts/render_docs_diagrams.py --check
      - run: python -m unittest discover -s tests -v
      - run: python -m ascend_poc validate --config examples/vllm-ascend.json
      - run: python -m ascend_poc validate --config examples/customer-template.json
      - run: python -m ascend_poc demo --output runs/ci-demo
      - run: python -m ascend_poc workflow-validate --config examples/ascend-workflow.json
      - run: python -m ascend_poc workflow-demo --output runs/ci-workflow-demo
      - run: python -m ascend_poc report --output runs/ci-workflow-demo
      - run: python -m ascend_poc workflow-validate --config examples/ascend-agent-workflow.json
      - run: python -m ascend_poc adaptive-plan --config examples/adaptive-shadow.json --windows examples/adaptive-windows.json --output runs/ci-shadow.json
      - run: python -m ascend_poc agent-validate --config examples/inference-rsi.json
      - run: python -m ascend_poc agent-validate --config examples/inference-rsi-ci.json
      - run: python -m ascend_poc agent-demo --output runs/ci-rsi-demo
      - run: python -m ascend_poc agent-report --output runs/ci-rsi-demo
      - run: python -m ascend_poc agent-demo --verification aba_ci --output runs/ci-rsi-block-demo
      - run: python -m ascend_poc agent-report --output runs/ci-rsi-block-demo
