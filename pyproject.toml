[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ascend-poc-autotuner"
version = "0.7.0"
description = "Bounded inference RSI agent for acceptance-driven vLLM-Ascend PoC optimization"
requires-python = ">=3.10"
dependencies = []
readme = "README.md"

[project.scripts]
ascend-poc = "ascend_poc.cli:main"

[tool.setuptools.packages.find]
include = ["ascend_poc*"]
